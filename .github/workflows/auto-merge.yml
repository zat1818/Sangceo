name: Merge otomatis

# Dipicu setelah workflow "Validasi klaim" selesai. Harus terpisah, karena merge
# lewat API baru diizinkan setelah centang wajib branch protection selesai.
on:
  workflow_run:
    workflows: ["Validasi klaim"]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            // Nomor PR dicari lewat head branch. commits/{sha}/pulls tidak menemukan
            // PR dari fork, jadi jalur itu tidak dipakai.
            const prDitemukan = await cariPR(run);
            if (!prDitemukan) return;
            const pull_number = prDitemukan.number;

            async function cariPR(run) {
              const pemilikHead =
                (run.head_repository && run.head_repository.owner && run.head_repository.owner.login) || owner;
              try {
                const { data } = await github.rest.pulls.list({
                  owner, repo, state: 'open', head: `${pemilikHead}:${run.head_branch}`, per_page: 20,
                });
                const cocok = data.find((p) => p.head.sha === run.head_sha);
                if (cocok) return cocok;
                if (data.length) return data[0];
              } catch {}
              try {
                const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
                return data.find((p) => p.head.sha === run.head_sha) || null;
              } catch {
                return null;
              }
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.draft) return;

            const author = pr.user.login.toLowerCase();
            const PATOK = /^data\/(domains|emails)\/[a-z0-9][a-z0-9.-]*\.json$/;
            // Field yang tidak boleh berubah lewat jalur otomatis. Ganti nama subdomain
            // atau alamat mailbox harus ditinjau manusia.
            const BEKU = ['domain', 'subdomain', 'owner', 'address'];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            if (!files.length) return;

            const tolak = async (sebab, tulisKomentar = true) => {
              if (!tulisKomentar) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `Merge otomatis dilewati: ${sebab}\n\nMenunggu tinjauan manusia.`,
              });
            };

            const diLuar = files.filter((f) => !PATOK.test(f.filename));
            if (diLuar.length) {
              await tolak(`ada berkas di luar \`data/domains/\` atau \`data/emails/\` (${diLuar.map((f) => `\`${f.filename}\``).join(', ')})`);
              return;
            }

            const hapus = files.filter((f) => f.status === 'removed');
            if (hapus.length) {
              await tolak(`ada berkas yang dihapus (${hapus.map((f) => `\`${f.filename}\``).join(', ')})`);
              return;
            }

            const baca = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };

            for (const f of files) {
              let baru;
              try {
                baru = await baca(f.filename, pr.head.sha);
              } catch {
                await tolak(`berkas \`${f.filename}\` tidak bisa dibaca sebagai JSON`);
                return;
              }
              if (String(baru.owner || '').toLowerCase() !== author) {
                await tolak(`\`${f.filename}\` tercatat atas nama \`${baru.owner || 'unknown'}\`, bukan \`${pr.user.login}\``);
                return;
              }
              if (f.status === 'modified') {
                let lama;
                try {
                  lama = await baca(f.filename, pr.base.sha);
                } catch {
                  await tolak(`versi lama \`${f.filename}\` tidak bisa dibaca`);
                  return;
                }
                const berubah = BEKU.filter((k) => String(lama[k] ?? '') !== String(baru[k] ?? ''));
                if (berubah.length) {
                  await tolak(`\`${f.filename}\` mengubah field \`${berubah.join('`, `')}\``);
                  return;
                }
              }
            }

            try {
              const { data: hasil } = await github.rest.pulls.merge({
                owner, repo, pull_number, merge_method: 'squash',
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: `Validasi lolos dan semua berkas yang berubah tercatat atas namamu, jadi PR ini di-merge otomatis (${hasil.sha.slice(0, 7)}). Perubahan aktif setelah sinkronisasi berikutnya.`,
              });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
              } catch {}
            } catch (e) {
              await tolak(`merge otomatis gagal (${e.message})`);
            }
